server:
  port: 8090

spring:
  application:
    name: agent-platform
  # RFC 9457 Problem Details：错误响应统一走标准格式
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hgsoft.agent.platform: INFO
